server:
  port: 8081
  servlet:
    context-path: /identity
  # Bật nén gzip - giảm 70-80% kích thước response
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hb_cinema_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    # Tối ưu HikariCP connection pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    # Tắt show-sql trong production để tăng tốc
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        # Batch inserts/updates để tăng hiệu năng
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

payment:
  vnPay:
    url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
    tmnCode: ${VNPAY_TMN_CODE:58X4B4HP}
    secretKey: ${VNPAY_SECRET_KEY}
    returnUrl: ${VNPAY_RETURN_URL:https://hb-cinema-web.pages.dev/identity/payment/vn-pay-callback}
    version: "2.1.0"
    command: "pay"
    orderType: "other"

# JWT keys phải được đặt qua biến môi trường - KHÔNG hard-code trong source code
jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 7200 # seconds (2 giờ)
  refreshable-duration: 720000 # seconds

